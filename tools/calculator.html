<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .calc { width: 100%; max-width: 480px; }
    .screen {
      border: 3px solid var(--border); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 14px; text-align: right;
      min-height: 120px; display: flex; flex-direction: column; justify-content: flex-end;
    }
    .expr { color: var(--mid); font-size: 1.3rem; min-height: 1.6rem; word-break: break-all; }
    .result { font-size: 3rem; font-weight: 700; word-break: break-all; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .keys button { padding: 18px 0; font-size: 1.8rem; }
    .wide { grid-column: span 2; }
  </style>
</head>
<body>
  <header>
    <a href="../index.html">&larr; Home</a>
    <h1>Calculator</h1>
    <button class="fs-btn" onclick="document.documentElement.requestFullscreen?.()">Full screen</button>
  </header>
  <main>
    <div class="calc">
      <div class="screen">
        <div class="expr" id="expr"></div>
        <div class="result" id="result">0</div>
      </div>
      <div class="keys">
        <button data-k="C">C</button>
        <button data-k="back">&#9003;</button>
        <button data-k="%">%</button>
        <button data-k="/">&divide;</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="*">&times;</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="-">&minus;</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="+">+</button>
        <button data-k="0" class="wide">0</button>
        <button data-k=".">.</button>
        <button data-k="=" class="dark">=</button>
      </div>
    </div>
  </main>
  <script>
    let expr = '';
    const exprEl = document.getElementById('expr');
    const resEl = document.getElementById('result');
    const pretty = s => s.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\+/g, ' + ').replace(/(\d|\))-/g, '$1 − ');

    function evaluate(s) {
      if (!/^[\d+\-*/.%() ]+$/.test(s)) return null;
      try {
        const v = Function('"use strict"; return (' + s.replace(/%/g, '/100') + ')')();
        if (!isFinite(v)) return 'Error';
        return parseFloat(v.toPrecision(12)).toString();
      } catch { return null; }
    }

    function press(k) {
      if (k === 'C') { expr = ''; resEl.textContent = '0'; }
      else if (k === 'back') { expr = expr.slice(0, -1); }
      else if (k === '=') {
        const v = evaluate(expr);
        if (v !== null) { exprEl.textContent = pretty(expr) + ' ='; resEl.textContent = v; expr = v === 'Error' ? '' : v; return; }
      } else {
        // Stop two operators in a row (except a leading minus)
        if (/[+\-*/]$/.test(expr) && /[+*/]/.test(k)) expr = expr.slice(0, -1);
        expr += k;
      }
      exprEl.textContent = pretty(expr);
      const live = evaluate(expr);
      if (live !== null && live !== 'Error') resEl.textContent = live;
    }

    document.querySelectorAll('.keys button').forEach(b => b.addEventListener('click', () => press(b.dataset.k)));
    document.addEventListener('keydown', e => {
      const map = { Enter: '=', Escape: 'C', Backspace: 'back' };
      const k = map[e.key] || e.key;
      if (/^[\d+\-*/.%]$/.test(k) || ['=', 'C', 'back'].includes(k)) { e.preventDefault(); press(k); }
    });
  </script>
</body>
</html>
