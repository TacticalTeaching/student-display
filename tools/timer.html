<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .time { font-size: clamp(5rem, 22vw, 16rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .done { animation: flash 0.6s steps(1) infinite; }
    @keyframes flash { 50% { background: var(--fg); color: var(--bg); } }
    .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
    .bar { width: 100%; max-width: 900px; height: 22px; border: 3px solid var(--border); border-radius: 11px; overflow: hidden; }
    .fill { height: 100%; background: var(--fg); width: 100%; transition: width 0.25s linear; }
  </style>
</head>
<body>
  <header>
    <a href="../index.html">&larr; Home</a>
    <h1>Timer</h1>
    <button class="fs-btn" onclick="document.documentElement.requestFullscreen?.()">Full screen</button>
  </header>
  <main id="main">
    <div class="time" id="time">05:00</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="row">
      <button data-min="1">1 min</button>
      <button data-min="2">2 min</button>
      <button data-min="5">5 min</button>
      <button data-min="10">10 min</button>
      <input type="number" id="custom" min="1" max="120" placeholder="mins" aria-label="Custom minutes">
      <button id="set">Set</button>
    </div>
    <div class="row">
      <button class="dark" id="start">Start</button>
      <button id="reset">Reset</button>
    </div>
  </main>
  <script>
    let total = 300, left = 300, timer = null, endAt = 0;
    const timeEl = document.getElementById('time');
    const fill = document.getElementById('fill');
    const startBtn = document.getElementById('start');
    const main = document.getElementById('main');

    function show() {
      const s = Math.max(0, Math.ceil(left));
      timeEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      fill.style.width = (total ? (left / total) * 100 : 0) + '%';
    }
    function stop() { clearInterval(timer); timer = null; startBtn.textContent = 'Start'; }
    function set(mins) { stop(); main.classList.remove('done'); total = left = mins * 60; show(); }
    function beep() {
      try {
        const ctx = new AudioContext();
        [0, 0.4, 0.8].forEach(t => {
          const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination);
          o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.25);
        });
      } catch {}
    }
    function tick() {
      left = (endAt - Date.now()) / 1000;
      if (left <= 0) { left = 0; stop(); main.classList.add('done'); beep(); }
      show();
    }

    document.querySelectorAll('[data-min]').forEach(b => b.addEventListener('click', () => set(+b.dataset.min)));
    document.getElementById('set').addEventListener('click', () => {
      const m = parseFloat(document.getElementById('custom').value);
      if (m > 0) set(m);
    });
    startBtn.addEventListener('click', () => {
      if (timer) { stop(); return; }
      if (left <= 0) return;
      main.classList.remove('done');
      endAt = Date.now() + left * 1000;
      timer = setInterval(tick, 250);
      startBtn.textContent = 'Pause';
    });
    document.getElementById('reset').addEventListener('click', () => set(total / 60));
    show();
  </script>
</body>
</html>
