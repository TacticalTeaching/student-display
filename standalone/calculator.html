<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
/* Shared style for all displays — black, white and grey only.
   Large text and buttons so it reads well on a projector and works on touch screens. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --mid: #777777;
  --light: #e6e6e6;
  --border: #222222;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 3px solid var(--border);
}
header h1 { margin: 0; font-size: 1.6rem; }
header a { color: var(--fg); font-weight: 600; text-decoration: none; font-size: 1.1rem; }
header a:hover { text-decoration: underline; }
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  gap: 20px;
}
button {
  font: inherit;
  font-size: 1.6rem;
  font-weight: 600;
  padding: 16px 20px;
  border: 3px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  touch-action: manipulation;
}
button:hover { background: var(--light); }
button:active { background: var(--fg); color: var(--bg); }
button.dark { background: var(--fg); color: var(--bg); }
button.dark:hover { background: #333; }
input[type="number"] {
  font: inherit;
  font-size: 1.6rem;
  width: 5.5em;
  padding: 10px;
  border: 3px solid var(--border);
  border-radius: 10px;
  text-align: center;
}

/* Home page grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  width: 100%;
  max-width: 1000px;
}
.card {
  display: block;
  padding: 28px 20px;
  border: 3px solid var(--border);
  border-radius: 12px;
  text-decoration: none;
  color: var(--fg);
  text-align: center;
}
.card:hover { background: var(--light); }
.card h2 { margin: 0 0 8px; font-size: 1.5rem; }
.card p { margin: 0; color: var(--mid); }

/* Fullscreen helper button */
.fs-btn { font-size: 1rem; padding: 8px 14px; }
</style>
  <style>
    .calc { width: 100%; max-width: 480px; }
    .screen {
      border: 3px solid var(--border); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 14px; text-align: right;
      min-height: 120px; display: flex; flex-direction: column; justify-content: flex-end;
    }
    .expr { color: var(--mid); font-size: 1.3rem; min-height: 1.6rem; word-break: break-all; }
    .result { font-size: 3rem; font-weight: 700; word-break: break-all; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .keys button { padding: 18px 0; font-size: 1.8rem; }
    .wide { grid-column: span 2; }
  </style>
</head>
<body>
  <header>
    <h1>Calculator</h1>
    <button class="fs-btn" onclick="document.documentElement.requestFullscreen?.()">Full screen</button>
  </header>
  <main>
    <div class="calc">
      <div class="screen">
        <div class="expr" id="expr"></div>
        <div class="result" id="result">0</div>
      </div>
      <div class="keys">
        <button data-k="C">C</button>
        <button data-k="back">&#9003;</button>
        <button data-k="%">%</button>
        <button data-k="/">&divide;</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="*">&times;</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="-">&minus;</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="+">+</button>
        <button data-k="0" class="wide">0</button>
        <button data-k=".">.</button>
        <button data-k="=" class="dark">=</button>
      </div>
    </div>
  </main>
  <script>
    let expr = '';
    const exprEl = document.getElementById('expr');
    const resEl = document.getElementById('result');
    const pretty = s => s.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\+/g, ' + ').replace(/(\d|\))-/g, '$1 − ');

    function evaluate(s) {
      if (!/^[\d+\-*/.%() ]+$/.test(s)) return null;
      try {
        const v = Function('"use strict"; return (' + s.replace(/%/g, '/100') + ')')();
        if (!isFinite(v)) return 'Error';
        return parseFloat(v.toPrecision(12)).toString();
      } catch { return null; }
    }

    function press(k) {
      if (k === 'C') { expr = ''; resEl.textContent = '0'; }
      else if (k === 'back') { expr = expr.slice(0, -1); }
      else if (k === '=') {
        const v = evaluate(expr);
        if (v !== null) { exprEl.textContent = pretty(expr) + ' ='; resEl.textContent = v; expr = v === 'Error' ? '' : v; return; }
      } else {
        // Stop two operators in a row (except a leading minus)
        if (/[+\-*/]$/.test(expr) && /[+*/]/.test(k)) expr = expr.slice(0, -1);
        expr += k;
      }
      exprEl.textContent = pretty(expr);
      const live = evaluate(expr);
      if (live !== null && live !== 'Error') resEl.textContent = live;
    }

    document.querySelectorAll('.keys button').forEach(b => b.addEventListener('click', () => press(b.dataset.k)));
    document.addEventListener('keydown', e => {
      const map = { Enter: '=', Escape: 'C', Backspace: 'back' };
      const k = map[e.key] || e.key;
      if (/^[\d+\-*/.%]$/.test(k) || ['=', 'C', 'back'].includes(k)) { e.preventDefault(); press(k); }
    });
  </script>
</body>
</html>
