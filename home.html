<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maths Home</title>
  <style>
    :root {
      --ink: #18212f;
      --muted: #647184;
      --paper: #f8f8f6;
      --panel: #ffffff;
      --slate: #c6ccd2;
      --green: #177b63;
      --green-dark: #0f5949;
      --green-light: #e8f4ef;
      --yellow: #f0c958;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--paper);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.5;
      background-image:
        linear-gradient(rgba(74, 124, 190, 0.28) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 124, 190, 0.28) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .app {
      width: min(1400px, 100%);
      height: 100dvh;
      max-height: 100dvh;
      margin: 0 auto;
      padding: clamp(16px, 3.5vh, 44px) clamp(16px, 2.5vw, 36px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(16px, 3vh, 36px);
      align-items: center;
      overflow: hidden;
    }

    header {
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--slate);
      padding: clamp(10px, 1.8vh, 18px) 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.2vw, 2.6rem);
      font-weight: 950;
      line-height: 1.05;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: minmax(68px, clamp(72px, 14vh, 120px));
      gap: clamp(12px, 1.8vw, 22px);
      width: 100%;
      align-content: center;
    }

    .topic-card {
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.96);
      padding: 14px 16px;
      display: grid;
      place-items: center;
      text-align: center;
      font: inherit;
      font-size: clamp(1.15rem, 1.8vw, 1.55rem);
      font-weight: 950;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .topic-card.is-active {
      background: #ffffff;
    }

    .topic-card.is-active:hover,
    .topic-card.is-active:focus-visible {
      transform: translateY(-1px);
      background: var(--green-light);
      border-color: var(--green-dark);
      color: var(--green-dark);
      outline: none;
    }

    /* Inactive sections at 10% opacity until working */
    .topic-card.is-inactive {
      opacity: 0.1;
      pointer-events: none;
      user-select: none;
      cursor: default;
    }

    @media (max-width: 900px) {
      .app {
        height: auto;
        max-height: none;
        overflow: visible;
      }

      .topic-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .topic-grid {
        grid-template-columns: 1fr;
      }
    }
    /* Greyscale printouts: on-screen colour is kept, prints are black, white and grey */
    @media print {
      html {
        filter: grayscale(1);
      }

      html, body {
        background: #fff;
      }

      body::before {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Maths Home</h1>
    </header>

    <main class="topic-grid" aria-label="Maths categories">
      <div class="topic-card is-inactive" aria-disabled="true">Operations</div>

      <a class="topic-card is-active" href="?page=number" data-page="number">Number</a>

      <div class="topic-card is-inactive" aria-disabled="true">Measurement</div>
      <div class="topic-card is-inactive" aria-disabled="true">Geometry</div>
      <div class="topic-card is-inactive" aria-disabled="true">Algebra</div>
      <div class="topic-card is-inactive" aria-disabled="true">Statistics</div>
      <div class="topic-card is-inactive" aria-disabled="true">Probability</div>
      <div class="topic-card is-inactive" aria-disabled="true">Rational Numbers</div>
      <div class="topic-card is-inactive" aria-disabled="true">Basic Facts</div>
      <div class="topic-card is-inactive" aria-disabled="true">Vocabulary</div>
    </main>
  </div>

  <script>
    function navigateTo(pageKey, fallbackHref) {
      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .loadPage(pageKey);
        return false;
      }
      if (fallbackHref) {
        window.location.href = fallbackHref;
      }
      return false;
    }

    document.querySelectorAll("[data-page]").forEach(function (link) {
      link.addEventListener("click", function (event) {
        event.preventDefault();
        navigateTo(link.getAttribute("data-page"), link.getAttribute("href"));
      });
    });
  </script>
</body>
</html>
